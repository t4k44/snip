[project]
name        = "snip"
version     = "0.5.4"
description = "snippets utils"
readme      = "README.md"
authors     = [
    { name = "Takashi Kikuchi", email = "tkskkc@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "argparse>=1.4.0",
    "sqlite-utils>=3.38",
]

[project.scripts]
snip = "snip.main:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
