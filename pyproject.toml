[project]
name        = "snip"
version     = "0.5.13"
description = "snippets utils"
readme      = "README.md"
authors     = [
    { name = "t4k44", email = "95964+t4k44@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "argcomplete>=3.6.3",
    "argparse>=1.4.0",
    "sqlite-utils>=3.38",
]

[project.scripts]
snip = "snip.main:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
